# 開発用プロファイル（http://localhost で動かすとき）
# Secure 属性の Cookie は HTTPS でないとブラウザが送らないため、開発中だけ外す
server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

# 開発中は Swagger UI から API を試せるようにする（docs/04_api-design.md 6章）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
