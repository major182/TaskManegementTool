spring:
  application:
    name: taskboard

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
    username: ${DB_USERNAME:taskboard}
    password: ${DB_PASSWORD:taskboard}

  jpa:
    # テーブルは Flyway が作るため、JPA は「定義が一致しているか」の確認だけ行う
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 背景画像のアップロード上限（docs/04_api-design.md 4.19）。既定は 1MB なので広げる。
  # リクエスト全体はファイル以外の部分（区切りの文字列など）のぶん余裕を持たせる
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # 実行環境が待ち受けポートを環境変数 PORT で指定することが多いため、そこから受け取る
  port: ${PORT:8080}
  # ALB・CloudFront など、TLS を終端して HTTP で転送する経路の配下で動かすときに必要。
  # これが無いとアプリがリクエストを「HTTPS ではない」と判断し、
  # Secure 属性を付けた Cookie が意図どおりに扱われない
  forward-headers-strategy: framework
  tomcat:
    # Tomcat は既定で、2MB を超えるリクエストを読み切らずに接続を切ることがある。
    # そうなると上限超過（413）の応答がブラウザに届かず、画面は通信エラーとしか分からない。
    # 上限（6MB）より大きな値にして、読み切ってから 413 を返せるようにする
    max-swallow-size: 10MB
  servlet:
    session:
      # 要件 F-08：ログイン状態は30日保持（docs/02_tech-stack.md 5.1）
      timeout: 30d
      cookie:
        # ブラウザを閉じても保持するため、Cookie 自体にも有効期限を持たせる。
        # これが無いとセッション Cookie（ブラウザを閉じたら消える）になり、
        # サーバー側の timeout だけでは F-08 を満たせない
        max-age: 30d
        http-only: true
        # 画面（React）は jar に同梱して同じサーバーから配るため、別サイト扱いにする必要がない。
        # SameSite=None は Secure 属性が必須で、HTTP で公開するとブラウザが Cookie を保存しない
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        # HTTPS でない環境では SESSION_COOKIE_SECURE=false を渡す。
        # 既定は安全側（true）にしておき、明示的に緩めたときだけ HTTP で動くようにする
        secure: ${SESSION_COOKIE_SECURE:true}

# 開発中に Vite の開発サーバー（http://localhost:5173）から呼べるようにするための設定。
# 本番では画面を jar に同梱して同じサーバーから配るため、CORS の出番は無い
# （課題としての単純さを優先し、設定自体は開発用に残している。docs/07_deployment.md 1.4）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ロードバランサ等からの死活確認用。health だけを外に出す（docs/04_api-design.md 3.6）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO

# API の説明画面（Swagger UI）は既定で閉じる。
# 誰でも API の一覧と試し打ちができてしまうため、開発用の local プロファイルだけで開く
# （docs/04_api-design.md 6章）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
