spring:
  application:
    name: taskboard

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
    username: ${DB_USERNAME:taskboard}
    password: ${DB_PASSWORD:taskboard}

  jpa:
    # テーブルは Flyway が作るため、JPA は「定義が一致しているか」の確認だけ行う
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      # 要件 F-08：ログイン状態は30日保持（docs/02_tech-stack.md 5.1）
      timeout: 30d
      cookie:
        http-only: true
        same-site: none
        secure: true

# 画面（Vercel / Vite）から Cookie 付きで呼べるようにする（docs/04_api-design.md 2.4）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
