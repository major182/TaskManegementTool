spring:
  application:
    name: taskboard

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
    username: ${DB_USERNAME:taskboard}
    password: ${DB_PASSWORD:taskboard}

  jpa:
    # テーブルは Flyway が作るため、JPA は「定義が一致しているか」の確認だけ行う
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # 実行環境が待ち受けポートを環境変数 PORT で指定することが多いため、そこから受け取る
  port: ${PORT:8080}
  # ALB・CloudFront など、TLS を終端して HTTP で転送する経路の配下で動かすときに必要。
  # これが無いとアプリがリクエストを「HTTPS ではない」と判断し、
  # Secure 属性を付けた Cookie が意図どおりに扱われない
  forward-headers-strategy: framework
  servlet:
    session:
      # 要件 F-08：ログイン状態は30日保持（docs/02_tech-stack.md 5.1）
      timeout: 30d
      cookie:
        # ブラウザを閉じても保持するため、Cookie 自体にも有効期限を持たせる。
        # これが無いとセッション Cookie（ブラウザを閉じたら消える）になり、
        # サーバー側の timeout だけでは F-08 を満たせない
        max-age: 30d
        http-only: true
        same-site: none
        secure: true

# 画面（Vercel / Vite）から Cookie 付きで呼べるようにする（docs/04_api-design.md 2.4）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ロードバランサ等からの死活確認用。health だけを外に出す（docs/04_api-design.md 3.6）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO

# API の説明画面（Swagger UI）は既定で閉じる。
# 誰でも API の一覧と試し打ちができてしまうため、開発用の local プロファイルだけで開く
# （docs/04_api-design.md 6章）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
