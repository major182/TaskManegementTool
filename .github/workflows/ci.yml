# CI（継続的インテグレーション）：push と Pull Request のたびに、
# lint・整形・テスト・ビルドを GitHub のサーバーで自動実行する（docs/02_tech-stack.md 3.4）。
# 失敗すると PR に ✕ が付くため、壊れたコードが main に入るのを防げる。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 型チェック・lint・整形・テストをまとめて実行する
      - run: npm run check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # 整形（Spotless）・Checkstyle・テストをまとめて実行する。
      # Testcontainers が使う Docker は ubuntu-latest に最初から入っている
      - run: ./gradlew check
